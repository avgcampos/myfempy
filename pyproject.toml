# myfempy install script:
# Install myfempy through `>> python install .`,
# or visit the github page to more information

[project]
name = "myfempy"
description = "A Python library based on finite element method to multiphysics analysis"
authors = [
    {name = "Antonio Vinicius Garcia Campos"},
]
readme = "README.md"
version = "0.10.5"
license = "GPL-3.0-or-later"
requires-python = ">= 3.11"
dependencies = [
	"numpy",
	"scipy",
	"cython",
	"matplotlib",
	"art",
]
keywords = ["FEM", "FEA", "FSI", "Engineering"]

classifiers = [
  "Development Status :: Beta",
  "Researchers :: Mechanical Engineers :: Students",
  "Topic :: Software Development :: Build Tools",
  "Programming Language :: Python :: 3.11",
]

[project.urls]
Code = "https://github.com/avgcampos/myfempy"
Homepage = "https://myfempy.readthedocs.io/en/latest/"
Releases = "https://github.com/avgcampos/myfempy/releases"

### Cython Compiler
[build-system]
requires = ["setuptools", "numpy", "cython"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["setup_wrap_cy_pyx"]
package-dir = {"" = "."}

[tool.setuptools.packages]
find = {}

[tool.setuptools.cmdclass]
build_ext = "setup_wrap_cy_pyx.build_ext"


[tool.semantic_release]
version_variables = [
    "myfempy/__init__.py:__version__"
]
branch = "main"
upload_to_vcs_release = true

# Adicione estas linhas para forçar a geração do changelog
changelog_file = "CHANGELOG.md"

[tool.semantic_release.changelog]
template_dir = "templates"
changelog_file = "CHANGELOG.md"
exclude_commit_patterns = []