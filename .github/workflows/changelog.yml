name: Generate Dynamic Release Changelog

on:
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write

jobs:
  update-changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install git-changelog
        run: |
          pip install git-changelog

      - name: Create docs directory if not exists
        run: mkdir -p docs

      - name: Generate Changelog for Current Version Only & Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          
          # Descobre a tag anterior para formar o range correto
          PREV_TAG=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || echo "")
          
          if [ -z "$PREV_TAG" ]; then
            RANGE="$TAG"
          else
            RANGE="$PREV_TAG..$TAG"
          fi
          
          # 1. Gera o changelog isolado da versão atual usando o filtro de commits (-F)
          git-changelog --style conventional -F "$RANGE" -o release_notes.md
          
          # 2. Atualiza a página da Release no GitHub com as notas limpas
          gh release edit "$TAG" --notes-file release_notes.md

      - name: Append to full docs/changelog.md
        run: |
          # 3. Reconstrói o histórico completo para o Read the Docs (sem restrição)
          git-changelog --style conventional -o docs/changelog.md

      - name: Create Pull Request with updated changelog
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: update changelog for release ${{ github.event.release.tag_name }}"
          branch: update-changelog-${{ github.event.release.tag_name }}
          title: "docs: update changelog for release ${{ github.event.release.tag_name }}"
          body: "Atualização automática do arquivo `docs/changelog.md` para a versão ${{ github.event.release.tag_name }}."
          base: main
          signoff: true
