name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev] # Assumindo que você tenha dependências de desenvolvimento/testes

      - name: Run Ruff (Linting)
        run: |
          pip install ruff
          ruff check .

      - name: Run Tests with Coverage
        run: |
          pip install pytest pytest-cov
          pytest --cov=myfempy --cov-report=term
