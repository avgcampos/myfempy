name: Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  Analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Copy files to repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Desabilitar clone raso para o SonarCloud analisar o histórico corretamente
      
      - name: Install python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install myfempy dependencies and package
        run: |
          python -m pip install --upgrade pip
          pip install .

      # - name: Run lint
      #   run: make lint

      # - name: Run tests
      #   run: make test
      
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
